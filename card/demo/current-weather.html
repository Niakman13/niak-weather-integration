<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Niak Weather — ciel animé</title>
<style>
  :root {font:14px/1.5 system-ui,sans-serif;color-scheme:light;--primary-text-color:#253047;--secondary-text-color:#606b7c;--primary-color:#308ddd;--card-background-color:#fff;--divider-color:#e8ebef;background:#f1f3f6;color:var(--primary-text-color)}
  :root.dark {color-scheme:dark;--primary-text-color:#edf1f7;--secondary-text-color:#a8b3c3;--card-background-color:#222932;--divider-color:#36404c;background:#151c25}
  body {margin:0;padding:28px;max-width:1450px;margin-inline:auto}
  h1 {font-size:21px;letter-spacing:-.5px;margin:0} header p {margin:4px 0 20px;color:var(--secondary-text-color)}
  .controls {display:flex;align-items:end;flex-wrap:wrap;gap:12px 20px;margin-bottom:24px}
  label {display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--secondary-text-color)}
  select {font:inherit;font-size:14px;padding:9px 28px 9px 10px;border:1px solid var(--divider-color);border-radius:7px;background:var(--card-background-color);color:var(--primary-text-color)}
  label.toggle {flex-direction:row;align-items:center;padding:9px 0;color:var(--primary-text-color)}
  main {max-width:100%;transition:max-width .2s;margin-inline:auto} main.mobile {max-width:375px}
  #source {position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--card-background-color);border:1px solid var(--divider-color);box-shadow:0 8px 30px #0002;border-radius:8px;padding:12px 20px;z-index:5}
  #source:empty {display:none} @media(max-width:600px){body{padding:12px}.controls{gap:10px}h1{font-size:19px}}
</style></head>
<body>
<header><h1>Niak Weather · ciel animé</h1><p>Aperçu de la v1.3 en préparation, avec des données de démonstration.</p></header>
<div class="controls">
  <label>Météo<select id="condition"><option value="partlycloudy">Éclaircies</option><option value="sunny">Soleil</option><option value="cloudy">Ciel couvert</option><option value="rainy">Pluie</option><option value="pouring">Fortes pluies</option><option value="lightning-rainy">Orage et pluie</option><option value="snowy">Neige</option><option value="snowy-rainy">Pluie et neige</option><option value="hail">Grêle</option><option value="fog">Brouillard</option><option value="windy">Vent</option><option value="clear-night">Nuit claire</option><option value="unavailable">Indisponible</option></select></label>
  <label>Moment<select id="phase"><option value="day">Journée</option><option value="twilight">Crépuscule</option><option value="night">Nuit</option></select></label>
  <label>Thème<select id="theme"><option value="light">Clair</option><option value="dark">Sombre</option></select></label>
  <label>Qualité<select id="quality"><option value="standard">Standard</option><option value="low">Allégée</option></select></label>
  <label class="toggle"><input type="checkbox" id="motion" checked> Animations</label>
  <label class="toggle"><input type="checkbox" id="mobile"> Largeur mobile</label>
</div>
<main aria-label="Aperçu de la carte météo"></main><div id="source" role="status"></div>
<script type="module">
  const icons=await fetch('/icons.json').then(r=>r.json());
  customElements.define('ha-icon',class extends HTMLElement {
    static get observedAttributes(){return ['icon'];}
    connectedCallback(){if(!this.shadowRoot)this.attachShadow({mode:'open'});this.draw();}
    attributeChangedCallback(){if(this.shadowRoot)this.draw();}
    draw(){const key='mdi'+(this.getAttribute('icon')?.split(':')[1]??'').split('-').map(s=>s[0]?.toUpperCase()+s.slice(1)).join('');
      this.shadowRoot.innerHTML=`<style>:host{display:inline-flex;vertical-align:middle;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);flex-shrink:0}svg{width:100%;height:100%;fill:currentColor}</style><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[key]??''}"></path></svg>`;}
  });
  customElements.define('ha-card',class extends HTMLElement {connectedCallback(){if(!this.shadowRoot)this.attachShadow({mode:'open'}).innerHTML='<style>:host{display:block;border-radius:22px;background:var(--card-background-color);box-shadow:0 8px 30px #132c4612;overflow:hidden;container-type:inline-size}</style><slot></slot>';}});
  await import('/card.js');
  const card=document.createElement('niak-weather-card');document.querySelector('main').append(card);
  const $=id=>document.getElementById(id);
  const sensor=(id,value,unit)=>({entity_id:id,state:String(value),attributes:{unit_of_measurement:unit}});
  function refresh(){
    const condition=$('condition').value,night=$('phase').value==='night';
    document.documentElement.classList.toggle('dark',$('theme').value==='dark');document.querySelector('main').classList.toggle('mobile',$('mobile').checked);
    const temp=condition==='snowy'?-1.5:night?16.4:22.8,rain=['rainy','lightning-rainy','snowy-rainy'].includes(condition)?1.4:condition==='pouring'?8.2:0;
    const wind=condition==='windy'?42:12;
    const now=new Date(),hour=now.getHours();
    const states={
      'weather.demo':{entity_id:'weather.demo',state:condition,attributes:{friendly_name:'Ma maison',temperature:temp,temperature_unit:'°C',attribution:'Bulletin de démonstration'}},
      'sensor.temperature':sensor('sensor.temperature',condition==='unavailable'?'unavailable':temp,'°C'),
      'sensor.humidity':sensor('sensor.humidity',65,'%'), 'sensor.humidex':sensor('sensor.humidex',temp+1.8,'°C'),
      'sensor.wind':sensor('sensor.wind',wind,'km/h'),'sensor.gust':sensor('sensor.gust',wind*1.6,'km/h'),
      'sensor.rain':sensor('sensor.rain',rain,'mm/h'),'sensor.rain_day':sensor('sensor.rain_day',rain*2,'mm'),
      'sensor.pressure':sensor('sensor.pressure',1014,'hPa'),'sensor.solar':sensor('sensor.solar',night?0:350,'W/m²'),
      'sun.sun':{entity_id:'sun.sun',state:night?'below_horizon':'above_horizon',attributes:{elevation:night?-20:$('phase').value==='twilight'?1:35}}
    };
    const forecasts={hourly:Array.from({length:18},(_,i)=>({datetime:new Date(now.getTime()+(i+1)*3600000).toISOString(),temperature:temp+4*Math.sin(i/5),precipitation:rain&&i<3?rain:0,condition})),daily:Array.from({length:7},(_,i)=>({datetime:new Date(now.getTime()+i*86400000).toISOString(),temperature:25-i,templow:17-i,precipitation:i===2?4:0,condition:i===2?'rainy':'partlycloudy'}))};
    card.setConfig({type:'custom:niak-weather-card',weather_entity:'weather.demo',temperature_entity:'sensor.temperature',humidity_entity:'sensor.humidity',humidex_entity:'sensor.humidex',wind_speed_entity:'sensor.wind',wind_gust_entity:'sensor.gust',rain_rate_entity:'sensor.rain',daily_rain_entity:'sensor.rain_day',pressure_entity:'sensor.pressure',solar_radiation_entity:'sensor.solar',forecast_source:'Démonstration',weather_animations:$('motion').checked,weather_animation_quality:$('quality').value});
    card.hass={states,language:'fr',config:{time_zone:Intl.DateTimeFormat().resolvedOptions().timeZone},callWS:async message=>({response:{'weather.demo':{forecast:forecasts[message.service_data.type]}}})};
  }
  $('condition').addEventListener('change',()=>{if($('condition').value==='clear-night')$('phase').value='night';refresh();});
  $('phase').addEventListener('change',()=>{if($('phase').value!=='night'&&$('condition').value==='clear-night')$('condition').value='sunny';refresh();});
  for(const id of ['theme','quality','motion','mobile'])$(id).addEventListener('change',refresh);
  let toast;card.addEventListener('hass-more-info',e=>{clearTimeout(toast);$('source').textContent='Source de démonstration : '+e.detail.entityId;toast=setTimeout(()=>$('source').textContent='',2500);});
  refresh();
</script>
</body></html>
