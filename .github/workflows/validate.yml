name: Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python -m pytest -q

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run validate
        working-directory: frontend
      - run: git diff --exit-code -- custom_components/niak_weather/frontend/

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: npm ci
        working-directory: card
      - run: npm run validate
        working-directory: card
      - run: git diff --exit-code -- custom_components/niak_weather/frontend/niak-weather-card.js
      # The bench shows what the integration computes: its engine draws the demonstration views.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npx playwright install --with-deps chromium
        working-directory: card
      - run: node scripts/browser-qa.mjs
        working-directory: card
      - run: npm run test:loading
        working-directory: card
      - run: node frontend/tests/extensions.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-parity
          path: card/test-results/

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
